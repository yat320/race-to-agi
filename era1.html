<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race to AGI · Prehistoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: mapa de misiones (pantalla de inicio) · misión = HUD de metas y reloj arriba, escena fija en canvas, barra de compra abajo · hojas para caravana y mejoras */
:root{
  --night:#15131b; --panel:#201d27; --panel-2:#2a2632; --line:#3e3848;
  --bone:#f0e7d4; --muted:#a99f91; --ochre:#dd9c40; --ochre-deep:#8d5b1f;
  --signal:#5fe3d0; --danger:#e8654d; --ok:#93d36c; --ink:#1b140a; --gold:#ffd35a; --silver:#c9d2de; --bronze:#c98f55;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Chivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font:14px/1.4 var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
img.px{image-rendering:pixelated;width:16px;height:16px;flex:none}
button{font-family:var(--f-display)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn{font:600 15px var(--f-display);background:var(--ochre);color:var(--ink);border:0;border-bottom:3px solid var(--ochre-deep);padding:9px 16px 7px;cursor:pointer}
.btn:disabled{background:var(--line);border-bottom-color:var(--panel);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.btn.big{font-size:18px;padding:12px 22px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#map{position:absolute;inset:0;overflow:auto;touch-action:pan-y;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 60% at 50% 0%,#2a2433 0%,var(--night) 70%)}
.map-wrap{max-width:520px;margin:0 auto;display:grid;gap:18px}
.kicker{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.map-title{margin:2px 0 0;font:700 clamp(34px,10vw,48px)/1 var(--f-display);color:var(--signal)}
.map-sub{margin:6px 0 0;color:var(--muted)}
.starbank{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.starbank b{font:700 24px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
.starbank span.t{color:var(--muted);font-size:13px;flex:1}
.path{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.node{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;text-align:left;color:var(--bone);width:100%}
.node:disabled{cursor:default;opacity:.55}
.node .num{width:54px;height:54px;display:grid;place-items:center;font:700 22px var(--f-display);background:var(--panel-2);border:2px solid var(--line)}
.node.open .num{border-color:var(--signal);color:var(--signal)}
.node.done .num{border-color:var(--gold);color:var(--gold)}
.node h3{margin:0;font:600 17px var(--f-display)}
.node p{margin:2px 0 0;font:400 12.5px var(--f-body);color:var(--muted)}
.stars{display:flex;gap:2px}
.stars i{width:16px;height:16px;background:var(--line);clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)}
.stars i.on{background:var(--gold)}
.stars.big i{width:44px;height:44px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.stars.big i.in{transform:scale(1)}
.map-foot{display:flex;gap:8px;flex-wrap:wrap}
#game{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#hud{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:grid;gap:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px;min-width:0}
#mName{font:600 14px var(--f-display);color:var(--ochre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#timer{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
#money{display:flex;align-items:center;gap:4px;font:700 18px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
.tbar{position:relative;height:6px;background:var(--panel-2);border:1px solid var(--line)}
.tbar i{position:absolute;top:0;bottom:0;left:0}
#tGold{background:var(--gold)}#tSilver{background:var(--silver)}
.goals{display:flex;gap:6px;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;font:600 15px var(--f-display);font-variant-numeric:tabular-nums;transition:border-color .3s,background .3s}
.goal.ok{border-color:var(--ok);background:#26331f;color:var(--ok)}
.goal.pop{animation:pop .35s ease-out}
@keyframes pop{50%{transform:scale(1.18)}}
#stage{position:relative;min-height:0}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#bar button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px var(--f-display);color:var(--bone);background:var(--panel-2);border:1px solid var(--line);border-bottom:3px solid var(--ochre-deep);padding:9px 6px 7px;cursor:pointer;min-width:0}
#bar button small{font:600 13px var(--f-display);color:var(--gold)}
#bar button:disabled{opacity:.45;cursor:default}
#bar button.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{border-color:var(--signal);box-shadow:0 0 0 3px rgba(95,227,208,.35)}}
#bar button:active:not(:disabled){transform:translateY(2px);border-bottom-width:1px}
#toasts{position:absolute;left:16px;right:16px;top:8px;display:grid;justify-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-size:13px;max-width:100%;animation:tin .25s ease-out}
.toast.good{border-color:var(--signal)}.toast.bad{border-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.sheet{position:absolute;inset:0;background:rgba(10,9,14,.6);display:flex;align-items:flex-end;justify-content:center;z-index:6}
.sheet-card{width:100%;max-width:560px;max-height:85%;background:var(--panel);border-top:2px solid var(--ochre);display:flex;flex-direction:column}
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:700 21px var(--f-display)}
.sheet-sub{font-size:12.5px;color:var(--muted)}
.sheet-body{overflow:auto;padding:10px 16px 16px;display:grid;gap:8px;touch-action:pan-y;overscroll-behavior:contain}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
.sheet-foot .btn{width:100%}
.trade{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:8px 10px}
.trade img{width:24px;height:24px}
.trade b{font:600 16px var(--f-display)}
.trade .pr{font:600 13px var(--f-display);color:var(--gold)}
.trade .q{font:700 18px var(--f-display);font-variant-numeric:tabular-nums;min-width:32px;text-align:center}
.trade .btns{display:flex;gap:4px}
.trade .btns button{font:600 14px var(--f-display);background:var(--panel);color:var(--bone);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
.order{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--ochre);padding:8px 10px}
.order .need{display:flex;gap:8px;flex-wrap:wrap}
.order .need span{display:flex;align-items:center;gap:3px;font:600 14px var(--f-display);color:var(--danger);font-variant-numeric:tabular-nums}
.order .need span.ok{color:var(--ok)}
.order .need img{width:20px;height:20px}
.order b{font:700 16px var(--f-display);color:var(--gold)}
.total{display:flex;justify-content:space-between;font:600 16px var(--f-display)}
.total b{color:var(--gold)}
.upg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px}
.upg img{width:40px;height:40px}
.upg h3{margin:0;font:600 16px var(--f-display)}
.upg .ch{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.upg .ch em{font-style:normal;color:var(--ok)}
.upg .unit{font-size:12px;color:var(--muted)}
.upg .lvl{display:flex;gap:3px;margin-top:4px}
.upg .lvl i{width:14px;height:5px;background:var(--line)}
.upg .lvl i.on{background:var(--ochre)}
.star-s{display:inline-block;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%);vertical-align:-2px}
.modal{position:absolute;inset:0;background:rgba(10,9,14,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8;overflow:auto}
.modal-card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);padding:22px 20px 18px;display:grid;gap:14px;margin:auto;text-align:center;justify-items:center}
.modal-card h2{margin:0;font:700 28px var(--f-display);color:var(--signal)}
.modal-card p{margin:0;font-size:14px;line-height:1.5;color:var(--bone)}
.modal-card .muted{color:var(--muted);font-size:13px}
.brief{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.times{display:flex;gap:14px;justify-content:center;font:600 13px var(--f-display);color:var(--muted)}
.times span{display:flex;align-items:center;gap:2px}
.col{display:grid;gap:8px;width:100%}
@media (prefers-reduced-motion:reduce){.toast,.goal.pop{animation:none}#bar button.pulse{animation:none}.stars.big i{transition:none}}
</style>
</head><body>
<div id="app">
  <section id="map" aria-label="Misiones de la Prehistoria">
    <div class="map-wrap">
      <header>
        <div class="kicker">Era 1 de 10 · Prehistoria</div>
        <h1 class="map-title">Race to AGI</h1>
        <p class="map-sub">Misiones cortas. Cuanto más rápido, más estrellas. Las estrellas compran mejoras que quedan para siempre.</p>
      </header>
      <div class="starbank"><span class="star-s" style="width:26px;height:26px"></span><b id="bank">0</b><span class="t" id="bankTxt">estrellas para gastar</span><button class="btn" id="openShop">Mejoras</button></div>
      <ol class="path" id="path"></ol>
      <div class="starbank" id="eraDone" hidden><span class="t">Prehistoria completa. Tu tribu te espera en la próxima era.</span><button class="btn" id="toEra2">Ir a la Antigüedad</button></div>
      <div class="map-foot"><button class="btn ghost" id="toHub">Todas las eras</button><button class="btn ghost" id="soundBtn">Sonido: sí</button></div>
    </div>
  </section>

  <section id="game" hidden>
    <div id="hud">
      <div class="hud-top"><span id="mName"></span><span id="timer">0:00</span><span id="money"></span></div>
      <div class="tbar" aria-hidden="true"><i id="tSilver"></i><i id="tGold"></i></div>
      <div class="goals" id="goals"></div>
    </div>
    <div id="stage"><canvas id="world" aria-label="Campamento"></canvas><div id="toasts" aria-live="polite"></div></div>
    <nav id="bar"></nav>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><div class="sheet-sub" id="sheetSub"></div></div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot"></div>
    </div>
  </div>
  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(function(){
'use strict';
const ERA_ID='era1m-'+Math.random().toString(36).slice(2);window.__rtagiActive=ERA_ID;const alive=()=>window.__rtagiActive===ERA_ID;
const KEY='rtagi-era1-misiones-v1',LEG='rtagi-legacy-v1';
const $=id=>document.getElementById(id);
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WW=176,WH=224;

/* ---------- sonido ---------- */
let AC=null,soundOn=true;try{soundOn=localStorage.getItem('rtagi-sound')!=='off';}catch(e){}

  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
  g.gain.setValueAtTime(vol||0.04,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.02);}catch(e){}}
const SFX={
  pick:n=>tone(520+Math.min(n,8)*60,0.07,'square',0.035,120),water:()=>{tone(300,0.15,'sine',0.06,300);tone(500,0.12,'sine',0.04,200,0.1);},
  plant:()=>tone(240,0.08,'triangle',0.05,160),buy:()=>{tone(660,0.06,'square',0.03);tone(990,0.08,'square',0.03,0,0.06);},

function sprite(rows,w,pal){w=w||16;const c=document.createElement('canvas');c.width=w;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((row,j)=>{for(let i=0;i<w;i++){const ch=row[i];if(!ch||ch==='.')continue;const col=(pal&&pal[ch])||PAL[ch];if(!col)continue;x.fillStyle=col;x.fillRect(i,j,1,1);}});return c;}
const S={};

S.mamut=[sprite(mamA,24,MAMP),sprite(mamA.slice(0,12).concat(['..kBBBk...kBBBk...kBk...','..kBBBk...kBBBk...kk....','..kkkkk...kkkkk.........']),24,MAMP)];
const fireBase=['...kkbbkkbbkk...','..kbBbbbbbbBbk..','.kSkkBbbbBkkSk..','kSSskkkkkkkksSk.','.kkk.......kkk..'];
S.fire=[sprite(['.......F........','......FF........','......FfF.......','.....FfFF.F.....','.....fFFFfF.....','....ofFFFFfo....','....offFFffo....','.....ooffoo.....'].concat(fireBase)),
  sprite(['........F.......','........FF......','.......FfF......','....F.FFfF......','.....FfFFFf.....','....ofFFFFFo....','....offFFFfo....','.....oofffo.....'].concat(fireBase))];

S.telar=sprite(['kkkkkkkkkkkkkkkk','kbbbbbbbbbbbbbbk','kkkkkkkkkkkkkkkk','.kbkrWuWrWuWkbk.','.kbkrWuWrWuWkbk.','.kbkrWuWrWuWkbk.','.kbkrWuWrWuWkbk.','.kbkkkkkkkkkkbk.','.kbk........kbk.','.kbk........kbk.','.kkk........kkk.']);
S.abaco=sprite(['................','.kkkkkkkkkkkkkk.','.kbBbbbbbbbbBbk.','.kbkkkkkkkkkkbk.','.kbkrRwwwwwuukbk','.kbkkkkkkkkkkbk.','.kbkwwFFwwwrRkbk','.kbkkkkkkkkkkbk.','.kbkuuwwwrRwwkbk','.kbkkkkkkkkkkbk.','.kbkwwwFFwwuukbk','.kbkkkkkkkkkkbk.','.kbBbbbbbbbbBbk.','.kkkkkkkkkkkkkk.','..kbk......kbk..','..kkk......kkk..']);

function endToMap(){G=null;$('game').hidden=true;$('map').hidden=false;renderMap();syncNav();}
function addAnimal(kind,init){
  const x=init?40+rnd()*110:60+rnd()*80,y=init?100+rnd()*90:90;
  G.animals.push({kind,x,y,tx:x,ty:y,hunger:1,starve:0,prod:rnd()*4,face:1,moving:false,t:0,eat:0,drop:init?0:0.5,seek:false});
}
const cellOf=(x,y)=>{const cx=Math.floor(x/16),cy=Math.floor(y/16)-GY0;return cx>=0&&cy>=0&&cx<GCOLS&&cy<GROWS?cy*GCOLS+cx:-1;};
function plant(x,y,free){
  const c=cellOf(x,y);if(c<0)return false;
  if(!free){if(G.water<=0){toast('Sin agua. Tocá el manantial.','bad');SFX.nope();return false;}G.water--;}
  const cx=c%GCOLS,cy=(c/GCOLS)|0;
  for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GCOLS||ny>=GROWS)continue;if(inSpring(nx*16+8,(ny+GY0)*16+8))continue;G.grass[ny*GCOLS+nx]=3;}
  for(let k=0;k<8;k++)G.fx.push({x:x+(rnd()-0.5)*20,y:y+(rnd()-0.5)*14,vx:(rnd()-0.5)*20,vy:-10-rnd()*20,t:0.5,col:'#6cbf5a'});
  if(!free){SFX.plant();G.planted=true;}return true;
}
const storeUsed=()=>Object.entries(G.store).reduce((a,[k,n])=>a+n*ITEMS[k].size,0);
const storeCap=()=>U('cueva');
function toast(msg,kind){if(!msg)return;const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;const b=$('toasts');b.appendChild(t);while(b.children.length>3)b.firstChild.remove();setTimeout(()=>t.remove(),2600);}
function float(x,y,txt,col){G.floats.push({x,y,txt,col,t:1.2});}
function dropProduct(kind,x,y){G.products.push({kind,x:clamp(x,6,170),y:clamp(y,8,216),age:0,life:kind==='lobo'?20:kind==='marfil'?30:U('fresco'),fly:0,bounce:0.4});SFX.drop();}
const refillTime=()=>G.m.winter?3.2:1.4;

/* ---------- pedidos ---------- */
function orderPool(){const m=G.m,p=[];if(m.buy.includes('ave')){p.push('huevo');if(m.slots[0])p.push('asado');}if(m.buy.includes('cabra')){p.push('leche');if(m.slots[1])p.push('queso');}if(m.buy.includes('oveja')){p.push('lana');if(m.slots[2])p.push('manta');}if(m.mamut)p.push('marfil');return p;}
function newOrder(){
  const pool=orderPool().sort(()=>rnd()-0.5),kinds=pool.slice(0,rnd()<0.5?1:2),items={};let v=0;
  for(const k of kinds){const n=k==='marfil'?1:1+Math.floor(rnd()*3);items[k]=n;v+=n*ITEMS[k].price;}
  G.orders.push({items,reward:Math.round(v*2/5)*5,t:0});SFX.order();toast('Nuevo pedido de otra tribu','good');
}
const canDeliver=o=>Object.entries(o.items).every(([k,n])=>(G.store[k]||0)>=n);
function deliverOrder(i){const o=G.orders[i];if(!o||!canDeliver(o))return;for(const[k,n]of Object.entries(o.items)){G.store[k]-=n;if(!G.store[k])delete G.store[k];}
  G.orders.splice(i,1);G.money+=o.reward;G.ordersDone++;G.orderT=8;SFX.coin();SFX.order();float(CARAVAN.x+10,CARAVAN.y-6,'+'+o.reward,'#ffd35a');renderTrade();}

/* ---------- lógica ---------- */
function update(dt){
  const g=G;g.t+=dt;
  if(g.refill>0){g.refill-=dt;if(g.refill<=0){g.water=U('agua');SFX.water();float(SPRING.x+16,SPRING.y-8,'+'+U('agua')+' agua','#8fc0dc');}}
  if(g.comboT>0){g.comboT-=dt;if(g.comboT<=0)g.combo=0;}
  if(g.m.winter){g.witherT+=dt;if(g.witherT>=2.5){g.witherT=0;const live=[];for(let c=0;c<g.grass.length;c++)if(g.grass[c])live.push(c);if(live.length){const c=live[Math.floor(rnd()*live.length)];g.grass[c]--;}}
    if(g.flakes.length<50&&rnd()<0.6)g.flakes.push({x:rnd()*WW,y:-4,v:10+rnd()*14,d:rnd()*6});for(const f of g.flakes){f.y+=f.v*dt;f.x+=Math.sin(g.t+f.d)*0.2;}g.flakes=g.flakes.filter(f=>f.y<WH+4);}
  for(const a of g.animals.slice()){
    const A=ANIM[a.kind];
    if(a.drop>0){a.drop-=dt;continue;}
    a.hunger=Math.max(0,a.hunger-dt/A.hunger);
    if(a.eat>0){a.eat-=dt;a.moving=false;if(a.eat<=0){const c=cellOf(a.x,a.y);if(c>=0&&g.grass[c]>0){g.grass[c]--;a.hunger=1;}}continue;}
    if(a.hunger<=0){a.starve+=dt;if(a.starve>10){g.animals.splice(g.animals.indexOf(a),1);toast(A.name+' murió de hambre','bad');SFX.bad();for(let k=0;k<6;k++)g.fx.push({x:a.x,y:a.y-4,vx:(rnd()-0.5)*30,vy:-20,t:0.6,col:'#a99f91'});continue;}}else a.starve=0;
    if(a.hunger>0){a.prod+=dt;if(a.prod>=A.every){a.prod=0;dropProduct(A.prod,a.x+(rnd()-0.5)*6,a.y+4);}}
    if(a.hunger<0.55&&!a.seek){let best=null,bd=1e9;for(let c=0;c<g.grass.length;c++){if(!g.grass[c])continue;const gx=(c%GCOLS)*16+8,gy=((c/GCOLS|0)+GY0)*16+8,dd=Math.hypot(gx-a.x,gy-a.y);if(dd<bd){bd=dd;best=[gx,gy];}}
      if(best){a.tx=best[0]+(rnd()-0.5)*6;a.ty=best[1]+(rnd()-0.5)*6;a.seek=true;}}
    const d=Math.hypot(a.tx-a.x,a.ty-a.y);
    if(d<2){a.moving=false;
      if(a.seek){a.seek=false;const c=cellOf(a.x,a.y);if(c>=0&&g.grass[c]>0)a.eat=1.1;}
      else{a.t-=dt;if(a.t<=0){a.t=1.5+rnd()*2.5;a.tx=clamp(a.x+(rnd()-0.5)*50,PAST.x0,PAST.x1);a.ty=clamp(a.y+(rnd()-0.5)*40,PAST.y0,PAST.y1);if(inSpring(a.tx,a.ty))a.tx+=40;}}}
    else{const sp=A.speed*(a.seek?1.4:1)*dt,st=Math.min(sp,d);a.x+=(a.tx-a.x)/d*st;a.y+=(a.ty-a.y)/d*st;a.moving=true;if(Math.abs(a.tx-a.x)>0.5)a.face=a.tx>a.x?1:-1;}
  }
  for(const p of g.products.slice()){
    if(p.bounce>0)p.bounce-=dt;
    if(p.fly>0){p.fly-=dt;const f=1-Math.max(0,p.fly)/0.35;p.x=p.sx+(CAVE.x+18-p.sx)*f;p.y=p.sy+(CAVE.y+22-p.sy)*f-Math.sin(f*Math.PI)*20;if(p.fly<=0){g.products.splice(g.products.indexOf(p),1);storeAdd(p.kind);}continue;}
    p.age+=dt;if(p.age>=p.life){g.products.splice(g.products.indexOf(p),1);float(p.x,p.y-4,'se pudrió','#a99f91');SFX.rot();}
  }
  g.slots.forEach((s,i)=>{if(!s||!s.built||!s.busy)return;s.busy-=dt;if(rnd()<dt*4)g.fx.push({x:SLOTS[i].x+11+(rnd()-0.5)*6,y:SLOTS[i].y+2,vx:(rnd()-0.5)*6,vy:-14,t:0.8,col:s.type==='fogon'?'#f08a24':'#e9dfc6'});
    if(s.busy<=0){s.busy=0;dropProduct(SHOPS[s.type].output,SLOTS[i].x+11+(rnd()-0.5)*12,SLOTS[i].y+36+rnd()*6);SFX.done();}});
  if(g.caravan.away>0){g.caravan.away-=dt;if(g.caravan.away<=0){const v=g.caravan.value;g.money+=v;float(CARAVAN.x+8,CARAVAN.y-4,'+'+v,'#ffd35a');SFX.coin();g.caravan.value=0;}}
  if(g.m.orders){g.orderT-=dt;if(g.orderT<=0){g.orderT=25;if(g.orders.length<2)newOrder();}}
  if(g.m.wolves){g.wolfT-=dt;if(g.wolfT<=0){g.wolfT=g.m.wolves.every+(rnd()-0.5)*8;spawnWolf();}}
  for(const w of g.wolves.slice()){
    const sp=(w.state==='leave'?26:15)*dt;
    if(w.state==='hunt'){let tgt=g.animals.includes(w.target)?w.target:null;if(!tgt){let bd=1e9;for(const a of g.animals){const dd=Math.hypot(a.x-w.x,a.y-w.y);if(dd<bd){bd=dd;tgt=a;}}w.target=tgt;}
      if(!tgt)w.state='leave';
      else{const d=Math.hypot(tgt.x-w.x,tgt.y-w.y);
        if(d<7){g.animals.splice(g.animals.indexOf(tgt),1);w.state='leave';toast('¡El lobo se llevó '+(tgt.kind==='ave'?'un ave':tgt.kind==='oveja'?'una oveja':'una cabra')+'!','bad');SFX.bad();g.shake=0.3;for(let k=0;k<8;k++)g.fx.push({x:tgt.x,y:tgt.y-4,vx:(rnd()-0.5)*40,vy:-20-rnd()*20,t:0.6,col:'#f6f1e4'});}
        else{w.x+=(tgt.x-w.x)/d*sp;w.y+=(tgt.y-w.y)/d*sp;w.face=tgt.x>w.x?1:-1;}}}
    else{const ex=w.x<88?-20:196;w.face=ex>w.x?1:-1;w.x+=Math.sign(ex-w.x)*sp;if(w.x<-18||w.x>194)g.wolves.splice(g.wolves.indexOf(w),1);}
    if(w.hit>0)w.hit-=dt;
  }
  if(g.m.mamut){g.mamutT-=dt;if(g.mamutT<=0){g.mamutT=g.m.mamut.every+(rnd()-0.5)*10;spawnMamut();}}
  for(const mm of g.mamuts.slice()){
    mm.x+=mm.dir*9*dt;if(mm.hit>0)mm.hit-=dt;
    const c=cellOf(mm.x,mm.y-2);if(c>=0&&g.grass[c]&&rnd()<dt*2)g.grass[c]=Math.max(0,g.grass[c]-1);
    if(mm.x<-30||mm.x>206){g.mamuts.splice(g.mamuts.indexOf(mm),1);toast('El mamut se fue.');}
  }
  for(const f of g.fx){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=60*dt;}g.fx=g.fx.filter(f=>f.t>0);
  for(const f of g.floats){f.t-=dt;f.y-=dt*14;}g.floats=g.floats.filter(f=>f.t>0);
  if(g.shake>0)g.shake-=dt;
  checkGoals();
}
function spawnWolf(){const left=rnd()<0.5;G.wolves.push({x:left?-12:188,y:100+rnd()*100,hp:U('red'),max:U('red'),state:'hunt',target:null,face:left?1:-1,hit:0});SFX.howl();if(!G.wolfWarned){toast('¡Un lobo! Tocalo hasta atraparlo.','bad');G.wolfWarned=true;}}
function spawnMamut(){const left=rnd()<0.5;G.mamuts.push({x:left?-24:200,y:110+rnd()*80,dir:left?1:-1,hp:U('lanza'),max:U('lanza'),hit:0});SFX.mamut();toast('¡Un mamut! Tocalo muchas veces.','good');G.shake=0.2;}
function storeAdd(k){G.store[k]=(G.store[k]||0)+1;G.collected[k]=(G.collected[k]||0)+1;}
function collect(p){
  if(storeUsed()+ITEMS[p.kind].size>storeCap()){toast('La cueva está llena. Vendé con la caravana o usá un taller.','bad');SFX.nope();G.fullWarn=true;return;}
  p.fly=0.35;p.sx=p.x;p.sy=p.y;G.combo=G.comboT>0?G.combo+1:1;G.comboT=1.3;SFX.pick(G.combo);
  if(G.combo>=3){float(p.x,p.y-8,'x'+G.combo,'#5fe3d0');if(G.combo%5===0){G.money+=5;float(p.x,p.y-16,'+5 combo','#ffd35a');SFX.coin();}}
  G.collectedAny=true;
}
function goalVal(k){const g=G;if(k==='conchas')return g.money;if(k==='lobo')return g.caught;if(k==='pedido')return g.ordersDone;if(k==='abaco')return g.abaco?1:0;if(k==='animales')return g.animals.length;if(ANIM[k])return g.animals.filter(a=>a.kind===k).length;return g.collected[k]||0;}
function checkGoals(){
  let all=true;
  for(const[k,n]of G.m.goals){const ok=goalVal(k)>=n;if(!ok)all=false;
    if(ok&&!G.goalOk[k]){G.goalOk[k]=true;SFX.goal();const el=$('g_'+k);if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}}
    else if(!ok&&G.goalOk[k])G.goalOk[k]=false;}
  if(all&&!G.won){G.won=true;setTimeout(winMission,500);}
}
function winMission(){
  if(!G)return;const g=G,stars=g.t<=g.m.gold?3:g.t<=g.m.silver?2:1,prev=prog.best[g.idx+1]||0,gain=Math.max(0,stars-prev);
  if(stars>prev){prog.best[g.idx+1]=stars;saveProg();}
  const last=g.idx+1>=MISSIONS.length;if(last)recordEra();
  showModal('<div class="kicker">Misión '+(g.idx+1)+' completa</div><h2>'+(last?'¡Prehistoria superada!':stars===3?'¡Perfecto!':stars===2?'¡Muy bien!':'¡Lo lograste!')+'</h2><div class="stars big" id="winStars">'+[1,2,3].map(s=>'<i class="'+(s<=stars?'on':'')+'"></i>').join('')+'</div><p>Tiempo: <b>'+fmtT(g.t)+'</b>'+(stars<3?' · para '+(stars+1)+' estrellas: '+fmtT(stars===2?g.m.gold:g.m.silver):'')+'</p>'+
    (gain?'<p style="color:var(--gold);font:600 16px var(--f-display)">+'+gain+' '+(gain===1?'estrella':'estrellas')+' para mejoras</p>':'<p class="muted">Tu récord era '+prev+(prev===1?' estrella':' estrellas')+'. Superalo para ganar más.</p>')+
    (last?'<p>La humanidad ya puede calcular: 10% del camino a la AGI. Tu tribu y tus inventos pasan a la Antigüedad.</p>':'')+
    '<div class="col">'+(last?'<button class="btn big" data-a="era2">Pasar a la Antigüedad</button>':'<button class="btn big" data-a="next">Siguiente misión</button>')+'<button class="btn ghost" data-a="shop">Mejoras ('+bank()+' disponibles)</button><div class="row" style="justify-content:center"><button class="btn ghost" data-a="retry">Repetir</button><button class="btn ghost" data-a="map">Mapa</button></div></div>','result');
  [...document.querySelectorAll('#winStars i')].forEach((el,i)=>setTimeout(()=>{el.classList.add('in');if(i<stars)SFX.star(i);},250+i*350));
  if(stars===3||last)setTimeout(SFX.win,1400);
}
function pauseMenu(){if(!G||G.won)return;showModal('<div class="kicker">Pausa · '+fmtT(G.t)+'</div><h2>'+G.m.name+'</h2><div class="brief">'+G.m.goals.map(([k,n])=>goalChip(k,Math.min(goalVal(k),n)+'/'+n)).join('')+'</div><div class="col"><button class="btn big" data-a="resume">Seguir</button><button class="btn ghost" data-a="retry">Reintentar</button><button class="btn ghost" data-a="quit">Salir al mapa</button></div>','pause');}
function buy(kind){if(!G||G.paused)return;const A=ANIM[kind];if(G.money<A.cost){toast('Te faltan conchas. Vendé con la caravana.','bad');SFX.nope();return;}G.money-=A.cost;addAnimal(kind);SFX.buy();float(88,80,'−'+A.cost,'#ffd35a');}
function tapSpring(){if(G.refill>0)return;if(G.water>=U('agua')){toast('El agua está llena.');return;}G.refill=refillTime();G.refillTot=G.refill;SFX.click();G.refilled=true;if(G.m.winter)toast('El agua está congelada: tarda más.');}

/* ---------- caravana y pedidos ---------- */
const CARAVAN_CAP=10;
function openTrade(){if(G.caravan.away>0&&!G.m.orders){toast('La caravana vuelve en '+Math.ceil(G.caravan.away)+' s.');return;}G.caravan.load={};openSheet('trade');}
const loadSize=()=>Object.entries(G.caravan.load).reduce((a,[k,n])=>a+n*ITEMS[k].size,0);
function renderTrade(){
  const g=G,ks=Object.keys(ITEMS).filter(k=>g.store[k]),away=g.caravan.away>0;
  $('sheetTitle').textContent='Caravana';$('sheetSub').textContent=away?'La caravana está de viaje: vuelve en '+Math.ceil(g.caravan.away)+' s.':'Cargá y mandala a otra tribu. Vuelve en '+U('caravana')+' s con conchas.';
  let html='';
  if(g.m.orders){html+='<div class="kicker" style="text-align:left">Pedidos</div>';
    html+=g.orders.length?g.orders.map((o,i)=>{const ok=canDeliver(o);return'<div class="order"><div class="need">'+Object.entries(o.items).map(([k,n])=>'<span class="'+((g.store[k]||0)>=n?'ok':'')+'"><img class="px" alt="'+ITEMS[k].name+'" src="'+ICON[k]+'">'+(g.store[k]||0)+'/'+n+'</span>').join('')+'</div><b>+'+o.reward+'</b><button class="btn" data-o="'+i+'"'+(ok?'':' disabled')+'>Entregar</button></div>';}).join(''):'<p style="color:var(--muted);margin:0">Esperando pedidos…</p>';
    html+='<div class="kicker" style="text-align:left;margin-top:6px">Vender</div>';}
  if(away)html+='<p style="color:var(--muted);margin:0">Cuando vuelva la caravana vas a poder vender.</p>';
  else html+=ks.length?ks.map(k=>'<div class="trade"><img class="px" alt="" src="'+ICON[k]+'"><div><b>'+ITEMS[k].name+'</b><div class="pr">'+ITEMS[k].price+' c/u · tenés '+g.store[k]+'</div></div><span class="q">'+(g.caravan.load[k]||0)+'</span><div class="btns"><button data-q="'+k+'" data-d="-1">−</button><button data-q="'+k+'" data-d="1">+</button><button data-q="'+k+'" data-d="all">Todo</button></div></div>').join(''):'<p style="color:var(--muted);text-align:center;margin:12px 0">La cueva está vacía. Juntá productos primero.</p>';
  $('sheetBody').innerHTML=html;
  const tot=Object.entries(g.caravan.load).reduce((a,[k,n])=>a+n*ITEMS[k].price,0);
  $('sheetFoot').innerHTML=(away?'':'<div class="total"><span>Carga '+loadSize()+'/'+CARAVAN_CAP+'</span><b>+'+tot+' conchas</b></div><button class="btn" data-a="send"'+(tot?'':' disabled')+'>Enviar</button>')+'<button class="btn ghost" data-a="closeSheet">'+(away?'Volver':'Cancelar')+'</button>';
}
function tradeAdj(k,d){const have=G.store[k]||0,cur=G.caravan.load[k]||0,sz=ITEMS[k].size,free=Math.floor((CARAVAN_CAP-loadSize())/sz);
  let n=cur;if(d==='all')n=cur+Math.min(have-cur,free);else if(d==='1')n=cur+(free>0&&cur<have?1:0);else n=Math.max(0,cur-1);G.caravan.load[k]=n;SFX.click();renderTrade();}
function sendCaravan(){
  let v=0;for(const[k,n]of Object.entries(G.caravan.load)){if(!n)continue;G.store[k]-=n;if(!G.store[k])delete G.store[k];v+=n*ITEMS[k].price;}
  if(!v)return;G.caravan.value=v;G.caravan.away=U('caravana');G.caravan.total=U('caravana');G.caravan.load={};G.sold=true;closeSheet();SFX.buy();toast('La caravana salió: vuelve con '+v+' conchas');
}

/* ---------- toques ---------- */
function onTap(wx,wy){
  const g=G;if(!g||g.paused||g.won)return;
  for(const mm of g.mamuts){if(Math.abs(mm.x-wx)<16&&wy>mm.y-20&&wy<mm.y+4){mm.hp--;mm.hit=0.12;SFX.thud();g.shake=0.1;for(let k=0;k<5;k++)g.fx.push({x:mm.x,y:mm.y-10,vx:(rnd()-0.5)*50,vy:-20-rnd()*20,t:0.5,col:'#c9bfa4'});
    if(mm.hp<=0){g.mamuts.splice(g.mamuts.indexOf(mm),1);dropProduct('marfil',mm.x-6,mm.y);dropProduct('marfil',mm.x+6,mm.y+2);SFX.caught();SFX.win();float(mm.x,mm.y-20,'¡Mamut!','#5fe3d0');g.shake=0.35;g.mamutAny=true;}
    else float(mm.x,mm.y-22,mm.hp+'','#f6f1e4');return;}}
  for(const w of g.wolves){if(w.state!=='leave'&&Math.abs(w.x-wx)<12&&Math.abs(w.y-6-wy)<12){w.hp--;w.hit=0.15;SFX.hit();g.shake=0.08;for(let k=0;k<4;k++)g.fx.push({x:w.x,y:w.y-4,vx:(rnd()-0.5)*40,vy:-20,t:0.4,col:'#c3c7cf'});
    if(w.hp<=0){g.wolves.splice(g.wolves.indexOf(w),1);g.caught++;g.caughtAny=true;dropProduct('lobo',w.x,w.y);SFX.caught();float(w.x,w.y-12,'¡Atrapado!','#5fe3d0');}else float(w.x,w.y-12,w.hp+'','#f6f1e4');return;}}
  let best=null,bd=12;for(const p of g.products){if(p.fly>0)continue;const d=Math.hypot(p.x-wx,p.y-wy);if(d<bd){bd=d;best=p;}}
  if(best){collect(best);return;}
  if(wx>SPRING.x-2&&wx<SPRING.x+SPRING.w+2&&wy>SPRING.y-8&&wy<SPRING.y+SPRING.h+4){tapSpring();return;}
  if(wx>CARAVAN.x-8&&wx<CARAVAN.x+26&&wy>CARAVAN.y-8&&wy<CARAVAN.y+18){openTrade();return;}
  if(g.m.abaco&&wx>ABACO.x-3&&wx<ABACO.x+25&&wy>ABACO.y-3&&wy<ABACO.y+26){tapAbaco();return;}

function currentHint(){
  const g=G,hs=g.m.hints||[];
  for(const h of hs){if(g.hintsDone[h])continue;
    const sl=h.startsWith('slot')?+h[4]:h.startsWith('shop')?+h[4]:-1;
    if(h==='plant'){if(g.planted){g.hintsDone[h]=1;continue;}return{x:100,y:140,txt:'Tocá el pasto para plantar'};}
    if(h==='egg'){if(g.collectedAny){g.hintsDone[h]=1;continue;}const p=g.products.find(p=>!p.fly);if(p)return{x:p.x,y:p.y-4,txt:'¡Tocá el huevo!'};continue;}
    if(h==='water'){if(g.refilled){g.hintsDone[h]=1;continue;}if(g.water===0)return{x:SPRING.x+16,y:SPRING.y,txt:'Tocá el manantial'};continue;}
    if(h==='buyAve'||h==='buyCabra'||h==='buyOveja'){const k=h.slice(3).toLowerCase(),A=ANIM[k];if(g.animals.filter(a=>a.kind===k).length>=(k==='ave'?3:1)){g.hintsDone[h]=1;continue;}if(g.money>=A.cost&&g.t>(k==='ave'?0:5))return{btn:k};continue;}
    if(h.startsWith('slot')){const s=g.slots[sl];if(!s||s.built){g.hintsDone[h]=1;continue;}if(g.money>=s.cost)return{x:SLOTS[sl].x+11,y:SLOTS[sl].y+2,txt:'Construí: '+SHOPS[s.type].name.toLowerCase()};continue;}
    if(h.startsWith('shop')){const s=g.slots[sl];if(!s||(g.used&&g.used[s.type])){g.hintsDone[h]=1;continue;}if(s.built&&g.store[SHOPS[s.type].input])return{x:SLOTS[sl].x+11,y:SLOTS[sl].y+2,txt:'Tocá el '+SHOPS[s.type].name.toLowerCase()};continue;}
    if(h==='caravan'){if(g.sold){g.hintsDone[h]=1;continue;}if(storeUsed()>=3||g.fullWarn)return{x:CARAVAN.x+10,y:CARAVAN.y-2,txt:'Vendé con la caravana'};continue;}
    if(h==='wolf'){if(g.caughtAny){g.hintsDone[h]=1;continue;}const w=g.wolves.find(w=>w.state==='hunt');if(w)return{x:w.x,y:w.y-10,txt:'¡Tocalo rápido!'};continue;}
    if(h==='winter'){if(g.t>12){g.hintsDone[h]=1;continue;}return{x:100,y:150,txt:'El pasto se seca: replantá seguido'};}
    if(h==='mamut'){if(g.mamutAny){g.hintsDone[h]=1;continue;}const mm=g.mamuts[0];if(mm)return{x:mm.x,y:mm.y-22,txt:'¡Tocalo muchas veces!'};continue;}
    if(h==='order'){if(g.ordersDone){g.hintsDone[h]=1;continue;}if(g.orders.some(canDeliver))return{x:CARAVAN.x+10,y:CARAVAN.y-2,txt:'Entregá el pedido'};if(g.orders.length&&g.t<30)return{x:CARAVAN.x+10,y:CARAVAN.y-2,txt:'Mirá los pedidos'};continue;}
    if(h==='abaco'){if(g.abaco){g.hintsDone[h]=1;continue;}g.abacoGot=g.abacoGot||{};const lf=abacoLeft();if(lf.some(([k])=>g.store[k]))return{x:ABACO.x+11,y:ABACO.y,txt:'Llevá esto al ábaco'};if(!lf.length&&g.money>=g.m.abaco.cost)return{x:ABACO.x+11,y:ABACO.y,txt:'¡Terminá el ábaco!'};continue;}
  }
  return null;
}

  $('money').innerHTML='<img class="px" alt="Conchas" src="'+ICON.concha+'">'+g.money;

  for(const[k,n]of g.m.goals){const el=$('g_'+k);if(!el)continue;const v=Math.min(goalVal(k),n);el.querySelector('span').textContent=v+'/'+n;el.classList.toggle('ok',v>=n);}
  document.querySelectorAll('#bar [data-buy]').forEach(b=>{b.disabled=g.money<ANIM[b.dataset.buy].cost;});
  const wb=$('waterBtn');if(wb)wb.innerHTML='<img class="px" alt="Agua" src="'+ICON.agua+'">'+(g.refill>0?'…':g.water+'/'+U('agua'));
}

/* ---------- bucle ---------- */
let last=performance.now(),lastHud=0;
function frame(now){
  if(!alive())return;
  const dt=Math.max(0,Math.min(0.1,(now-last)/1000));last=now;
  if(G&&!G.paused&&!G.won)update(dt);
  draw();
  if(now-lastHud>120){hudUpdate();lastHud=now;}
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{if(alive()&&G)resize();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&alive()&&G&&!G.won&&$('modal').hidden)pauseMenu();});
renderMap();requestAnimationFrame(frame);
if(location.search.indexOf('debug')>=0)window.__m={get G(){return G;},update,startMission,onTap,prog,collect,tapSlot,sendCaravan,deliverOrder,tapAbaco,canDeliver,MISSIONS};
})();
</script>

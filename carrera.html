<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race to AGI · Carrera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: HUD con turno, monedas y las dos barras de la carrera · mapa en canvas · barra de contexto del casillero elegido · botones Investigar / Fin del turno · hojas y modales */
:root{
  --night:#15131b; --panel:#201d27; --panel-2:#2a2632; --line:#3e3848; --line-2:#56506a;
  --bone:#f0e7d4; --muted:#a99f91; --ochre:#dd9c40; --ochre-deep:#8d5b1f;
  --signal:#5fe3d0; --danger:#e8654d; --ok:#93d36c; --ink:#1b140a; --gold:#ffd35a; --you:#5fe3d0; --foe:#e8654d;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Chivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font:14px/1.4 var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
img.px{image-rendering:pixelated;width:16px;height:16px;flex:none}
button{font-family:var(--f-display)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn{font:600 15px var(--f-display);background:var(--ochre);color:var(--ink);border:0;border-bottom:3px solid var(--ochre-deep);padding:9px 16px 7px;cursor:pointer}
.btn:disabled{background:var(--line);border-bottom-color:var(--panel);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.btn.big{font-size:18px;padding:12px 22px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kicker{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
#game{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto}
#hud{padding:calc(6px + env(safe-area-inset-top,0px)) 14px 6px;display:grid;gap:4px;background:var(--panel);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px}
#turn{font:600 14px var(--f-display);color:var(--ochre);flex:1}
#money{display:flex;align-items:center;gap:4px;font:700 18px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
#money small{font:600 12px var(--f-display);color:var(--muted)}
.rb{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;font:600 12px var(--f-display)}
.rb .who{color:var(--muted)}.rb.you .who{color:var(--you)}.rb.foe .who{color:var(--foe)}
.rbar{position:relative;height:7px;background:var(--panel-2);border:1px solid var(--line)}
.rbar i{position:absolute;top:0;bottom:0;left:0;transition:width .4s}
.rb.you .rbar i{background:var(--you)}.rb.foe .rbar i{background:var(--foe)}
.rb .rtxt{color:var(--muted);font:400 11.5px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#stage{position:relative;min-height:0;background:#1b1a24}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:6px;z-index:3}
#zoom button{width:40px;height:40px;padding:0;font:700 22px/1 var(--f-display);color:var(--bone);background:var(--panel-2);border:1px solid var(--line);border-bottom:3px solid var(--line-2);cursor:pointer}
#zoom button:disabled{opacity:.35;cursor:default}
#toasts{position:absolute;left:12px;right:12px;top:6px;display:grid;justify-items:center;gap:5px;pointer-events:none;z-index:4}
.toast{background:var(--panel);border:1px solid var(--line);padding:5px 11px;font-size:12.5px;max-width:100%;animation:tin .25s ease-out}
.toast.good{border-color:var(--signal)}.toast.bad{border-color:var(--danger)}.toast.foe{border-color:var(--foe);color:var(--bone)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#ctx{background:var(--panel);border-top:1px solid var(--line);padding:6px 14px 4px;display:grid;gap:5px;min-height:62px}
#ctxInfo{font-size:13px;color:var(--bone);display:flex;align-items:center;gap:8px;min-height:18px}
#ctxInfo .px{width:20px;height:20px}
#ctxInfo b{font:600 14px var(--f-display)}
#ctxInfo .m{color:var(--muted)}
#ctxBtns{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x}
#ctxBtns::-webkit-scrollbar{height:0}
#ctxBtns button{flex:none;display:flex;align-items:center;gap:5px;font:600 13.5px var(--f-display);color:var(--bone);background:var(--panel-2);border:1px solid var(--line);border-bottom:3px solid var(--ochre-deep);padding:7px 10px 5px;cursor:pointer;white-space:nowrap}
#ctxBtns button small{font:600 12.5px var(--f-display);color:var(--gold)}
#ctxBtns button:disabled{opacity:.45;cursor:default}
#ctxBtns button.hot{border-color:var(--signal)}
#ctxBtns .why{flex:none;align-self:center;font-size:12px;color:var(--muted);white-space:nowrap}
#bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;padding:6px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
#bar button{font:600 16px var(--f-display);padding:10px 8px 8px;cursor:pointer;border:1px solid var(--line);border-bottom:3px solid var(--ochre-deep);background:var(--panel-2);color:var(--bone)}
#bar button.primary{background:var(--ochre);color:var(--ink);border-color:var(--ochre)}
#bar button.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(95,227,208,.4)}}
#bar button:active{transform:translateY(2px);border-bottom-width:1px}
.sheet{position:absolute;inset:0;background:rgba(10,9,14,.6);display:flex;align-items:flex-end;justify-content:center;z-index:6}
.sheet-card{width:100%;max-width:560px;max-height:88%;background:var(--panel);border-top:2px solid var(--ochre);display:flex;flex-direction:column}
.sheet-head{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:700 21px var(--f-display)}
.sheet-sub{font-size:12.5px;color:var(--muted)}
.sheet-body{overflow:auto;padding:8px 16px 14px;display:grid;gap:6px;touch-action:pan-y;overscroll-behavior:contain}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
.sheet-foot .btn{width:100%}
.branch{font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin-top:6px}
.tech{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:7px 10px}
.tech.has{border-color:var(--ok)}
.tech.has h3{color:var(--ok)}
.tech h3{margin:0;font:600 15px var(--f-display);display:flex;gap:6px;align-items:center}
.tech h3 .tier{display:inline-flex;gap:2px}
.tech h3 .tier i{width:6px;height:6px;background:var(--line-2)}
.tech h3 .tier i.on{background:var(--ochre)}
.tech p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.tech .btn{padding:7px 10px 5px;font-size:13.5px;white-space:nowrap}
.tech .skip{font-size:11px;color:var(--danger)}
.modal{position:absolute;inset:0;background:rgba(10,9,14,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8;overflow:auto}
.modal-card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);padding:20px 18px 16px;display:grid;gap:12px;margin:auto;text-align:center;justify-items:center}
.modal-card h2{margin:0;font:700 26px var(--f-display);color:var(--signal)}
.modal-card h2.lose{color:var(--danger)}
.modal-card p{margin:0;font-size:14px;line-height:1.5}
.modal-card .muted{color:var(--muted);font-size:13px}
.col{display:grid;gap:8px;width:100%}
.choice{display:grid;gap:3px;text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;color:var(--bone);cursor:pointer;width:100%}
.choice b{font:600 16px var(--f-display);color:var(--gold)}
.choice span{font:400 13px var(--f-body);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#bar button.pulse{animation:none}.rbar i{transition:none}}
</style>
</head><body>
<div id="app">
  <section id="game">
    <div id="hud">
      <div class="hud-top"><span id="turn">Turno 1 de 30</span><span id="money"></span></div>

      <div class="rb foe"><span class="who">Rival</span><div class="rbar"><i id="rbFoe"></i></div><span class="rtxt" id="rtFoe"></span></div>
    </div>
    <div id="stage"><canvas id="world" aria-label="Mapa"></canvas><div id="toasts" aria-live="polite"></div><div id="zoom"><button id="zIn" aria-label="Acercar">+</button><button id="zOut" aria-label="Alejar">−</button></div></div>
    <div id="ctx"><div id="ctxInfo"></div><div id="ctxBtns"></div></div>

      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot"></div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
</div>

// Distancia (px de arte) del punto (i,j) del casillero (tx,ty) al vecino más cercano de la otra clase (agua/tierra, o visto/no visto).
const nearAny=(tx,ty,other)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&inb(tx+dx,ty+dy)&&other(tx+dx,ty+dy))return true;return false;};
function edgeD(tx,ty,i,j,other){let d=99;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if((!dx&&!dy)||!inb(tx+dx,ty+dy)||!other(tx+dx,ty+dy))continue;
  const ex=dx<0?i:TA-1-i,ey=dy<0?j:TA-1-j;d=Math.min(d,dx&&dy?Math.hypot(ex,ey):dx?ex:ey);}return d;}
function treeAt(a,x,y,k,pal){darken(a,x+4,y+1,Math.round(12*k),Math.round(4*k),0.7);rect(a,x-3,y-10,6,11,OUTL);rect(a,x-2,y-10,4,10,WOOD[2]);rect(a,x-2,y-10,1,10,WOOD[3]);
  blob(a,[[x-6*k,y-12*k,7*k],[x+6*k,y-12*k,7*k],[x,y-16*k,9*k],[x,y-23*k,7*k]],pal,TREEL);}
function mountainAt(a,ox,oy,cx,top,base,hw,seed){const H=base-top;
  for(let y=top;y<=base;y++){const f=(y-top)/H,half=Math.max(0.6,f*hw),ridge=cx+f*hw*0.22+(noise(0,y/5,seed)-0.5)*4,snowY=0.3+(noise((y*7)/9,1,seed+1)-0.5)*0.08;
    for(let x=Math.floor(cx-half);x<=Math.ceil(cx+half);x++){const X=ox+x,Y=oy+y,edge=x<cx-half+1.2||x>cx+half-1.2||y===base,lit=x<ridge,snow=f<snowY+(noise(x/3,9,seed)-0.5)*0.14;
      let c;if(edge)c=MOUT;else if(snow)c=lit?SNOW[1]:SNOW[0];else{const n=noise(X/5,Y/4,seed+2)+dith(X,Y)*0.35;c=lit?(n>0.55?ROCK[3]:ROCK[2]):(n>0.6?ROCK[1]:ROCK[0]);}
      a.set(X,Y,c);}}}

function buildTerrain(){const s=G.seed|0,a=Art(WW*A,WH*A),water=(x,y)=>tileAt(x,y).t===3;
  for(const t of G.tiles){const W3=t.t===3,ox=t.x*TA,oy=t.y*TA,other=(x,y)=>water(x,y)!==W3,base=t.t===1?FO:t.t===2?MO:GR,coast=nearAny(t.x,t.y,other);
    for(let j=0;j<TA;j++)for(let i=0;i<TA;i++){const X=ox+i,Y=oy+j,n=noise(X/20,Y/20,s)*0.7+noise(X/7,Y/7,s+3)*0.3,d=coast?edgeD(t.x,t.y,i,j,other)+(noise(X/9,Y/9,s+5)-0.5)*6:99;let c;
      if(W3)c=d<2.5?FOAM:d<4.5?(dith(X,Y)>0?FOAM:SHL[2]):d<15?pick(SHL,1-(d-4.5)/10.5,X,Y):pick(WA,n,X,Y);
      else c=d<6||(d<9&&dith(X,Y)+0.5>(d-6)/3)?pick(SAND,n,X,Y):pick(base,n,X,Y);
      if(i===0||j===0)c=mulc(c,0.9);a.u[Y*a.w+X]=c;}}
  for(const t of G.tiles){const r=mulberry(s*131+t.x*977+t.y*7919),ox=t.x*TA,oy=t.y*TA,W3=t.t===3,far=(i,j)=>edgeD(t.x,t.y,i,j,(x,y)=>water(x,y)!==W3)>10;
    if(t.t===0||t.t===1)for(let k=0;k<(t.t===0?24:12);k++){const i=3+Math.floor(r()*58),j=6+Math.floor(r()*56);if(!far(i,j))continue;const h=3+Math.floor(r()*3);
      for(const[dx,hh]of[[-1,h-1],[0,h],[1,h-2]])for(let q=0;q<hh;q++)a.set(ox+i+dx,oy+j-q,q===hh-1?BLADE[2]:q===0?BLADE[0]:BLADE[1]);}
    if(t.t===0&&r()<0.6)for(let k=0;k<1+Math.floor(r()*3);k++){const i=6+Math.floor(r()*52),j=8+Math.floor(r()*50);if(!far(i,j))continue;const fc=hx(['#e8654d','#f6f1e4','#b08ad8','#ffd35a'][Math.floor(r()*4)]);
      a.set(ox+i,oy+j+2,BLADE[0]);a.set(ox+i,oy+j+1,BLADE[1]);for(const[dx,dy]of[[0,-1],[-1,0],[1,0],[0,1]])a.set(ox+i+dx,oy+j-1+dy,fc);a.set(ox+i,oy+j-1,hx('#ffd35a'));}
    if(t.t===1){const spots=[[18,30],[46,26],[30,50],[52,54],[12,56]].map(([x,y])=>[x+Math.round((r()-0.5)*8),y+Math.round((r()-0.5)*6)]).slice(0,3+Math.floor(r()*2)).sort((p,q)=>p[1]-q[1]);
      for(const[x,y]of spots)treeAt(a,ox+x,oy+y,0.85+r()*0.25,r()<0.3?TREE2:TREE);}
    if(t.t===2){const flip=r()<0.5,sx=x=>flip?64-x:x;mountainAt(a,ox,oy,sx(44),16+Math.floor(r()*4),52,16,s+t.x*7+t.y);mountainAt(a,ox,oy,sx(26),6+Math.floor(r()*5),57,24,s+t.x*3+t.y*5);
      for(let k=0;k<3;k++){const i=6+Math.floor(r()*52),j=56+Math.floor(r()*6);blob(a,[[ox+i,oy+j,2+r()*1.5]],ROCK,MOUT);}}
    if(W3)for(let k=0;k<6;k++){const i=4+Math.floor(r()*54),j=6+Math.floor(r()*54);if(!far(i,j))continue;const c=r()<0.5?SHL[2]:hx('#8fc0dc');
      for(const[dx,dy]of[[0,0],[1,-1],[2,-1],[3,-1],[4,0]])a.set(ox+i+dx,oy+j+dy,c);}}
  return a.canvas();}

// Niebla: casilleros sin ver tapados del todo; el tramado del borde cae sobre los ya vistos, así no revela nada.
const FOGC=P4('#1b1a24','#201d27','#26222e');let fogTex=null;
function buildFog(){const a=Art(WW*A,WH*A),un=(x,y)=>!G.P[0].seen[idx(x,y)];
  if(!fogTex){fogTex=new Uint32Array(a.w*a.h);for(let Y=0;Y<a.h;Y++)for(let X=0;X<a.w;X++)fogTex[Y*a.w+X]=pick(FOGC,noise(X/16,Y/16,3)*0.7+noise(X/5,Y/5,4)*0.3,X,Y);}
  for(const t of G.tiles){const ox=t.x*TA,oy=t.y*TA;
    if(un(t.x,t.y)){for(let j=0;j<TA;j++){const o=(oy+j)*a.w+ox;a.u.set(fogTex.subarray(o,o+TA),o);}continue;}
    if(!nearAny(t.x,t.y,un))continue;
    for(let j=0;j<TA;j++)for(let i=0;i<TA;i++){const X=ox+i,Y=oy+j,d=edgeD(t.x,t.y,i,j,un);if(d<12&&(1-d/12)*0.85>dith(X,Y)+0.47)a.u[Y*a.w+X]=FOGC[1];}}
  return a.canvas();}

  const r=mulberry(seed),tiles=[];
  const n=5,grid=[];for(let i=0;i<n*n;i++)grid.push(r());
  const noise=(x,y)=>{const gx=x/(MW-1)*(n-1),gy=y/(MH-1)*(n-1),x0=Math.floor(gx),y0=Math.floor(gy),x1=Math.min(n-1,x0+1),y1=Math.min(n-1,y0+1),fx=gx-x0,fy=gy-y0;const a=grid[y0*n+x0],b=grid[y0*n+x1],c=grid[y1*n+x0],d=grid[y1*n+x1];return(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;};
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const v=noise(x,y)+(r()-0.5)*0.22;let t=0;if(v<0.32)t=3;else if(v>0.7)t=2;else if(r()<0.32)t=1;tiles.push({x,y,t,res:null,imp:null,owner:-1,cid:-1,village:false,ruins:false});}
  const land=(x,y)=>inb(x,y)&&tiles[idx(x,y)].t!==3;
  const landAround=(x,y)=>{let k=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(land(x+dx,y+dy))k++;return k;};
  const pickCap=(x0,y0)=>{let best=null,bs=-1;for(let y=y0;y<y0+3;y++)for(let x=x0;x<x0+3;x++){const s=landAround(x,y)+r()*0.5;if(s>bs){bs=s;best=[x,y];}}const t=tiles[idx(best[0],best[1])];t.t=0;return best;};
  const caps=[pickCap(1,MH-4),pickCap(MW-4,1)];
  const special=[...caps];
  const far=(x,y,d)=>special.every(([sx,sy])=>cheb(x,y,sx,sy)>=d);
  const villages=[];let tries=0;
  while(villages.length<6&&tries<800){tries++;const x=Math.floor(r()*MW),y=Math.floor(r()*MH);const t=tiles[idx(x,y)];if(t.t===3||t.t===2||!far(x,y,3))continue;t.village=true;villages.push([x,y]);special.push([x,y]);}
  let ruins=0;tries=0;while(ruins<3&&tries<400){tries++;const x=Math.floor(r()*MW),y=Math.floor(r()*MH);const t=tiles[idx(x,y)];if(t.t===3||t.village||!far(x,y,2))continue;t.ruins=true;ruins++;special.push([x,y]);}
  for(const t of tiles){if(t.village||t.ruins)continue;
    if(t.t===0){const v=r();if(v<0.16)t.res='fruta';else if(v<0.3)t.res='cultivo';}

  for(const [cx,cy] of special){const t0=tiles[idx(cx,cy)];if(!(t0.village||caps.some(c=>c[0]===cx&&c[1]===cy)))continue;
    let food=0;const ring=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const t=tileAtT(tiles,cx+dx,cy+dy);if(!t||t.village||t.ruins)continue;ring.push(t);if(t.res==='fruta'||t.res==='caza'||t.res==='pez')food++;}
    ring.sort(()=>r()-0.5);for(const t of ring){if(food>=2)break;if(t.t===0&&t.res!=='fruta'){t.res='fruta';food++;}else if(t.t===1&&t.res!=='caza'){t.res='caza';food++;}}

function tileAtT(tiles,x,y){return inb(x,y)?tiles[idx(x,y)]:null;}
function newGame(seed,aiBoth){
  const m=genMap(seed);
  G={seed,turn:1,over:null,tiles:m.tiles,cities:[],units:[],nid:1,log:[],
     P:[{name:'Vos',money:4,techs:{},seen:new Array(MW*MH).fill(0),ai:!!aiBoth},{name:'Rival',money:4,techs:{},seen:new Array(MW*MH).fill(0),ai:true}]};
  m.caps.forEach(([x,y],p)=>found(p,x,y,true));
  G.P.forEach((P,p)=>{P.money+=income(p);});
  sel=null;reach=null;pendingLevel=[];
}
function found(p,x,y,cap){
  const c={id:G.nid++,owner:p,x,y,level:1,pop:0,cap:!!cap,b:{},obra:0,radius:1,trained:0,sabT:-9};
  G.cities.push(c);const t=tileAt(x,y);t.village=false;t.cid=c.id;t.owner=p;claim(c);updateSeen(p);return c;
}
function claim(c){for(let dy=-c.radius;dy<=c.radius;dy++)for(let dx=-c.radius;dx<=c.radius;dx++){const t=tileAt(c.x+dx,c.y+dy);if(t&&t.owner<0){t.owner=c.owner;t.cid=c.id;}}}
function updateSeen(p){const P=G.P[p];const mark=(x,y,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(inb(x+dx,y+dy))P.seen[idx(x+dx,y+dy)]=1;};
  for(const c of citiesOf(p))mark(c.x,c.y,c.level>=3?3:2);for(const u of G.units)if(u.owner===p)mark(u.x,u.y,tileAt(u.x,u.y).t===2?2:1);
  if(has(p,'astronomia'))P.seen.fill(1);}
const seen=(p,x,y)=>!!G.P[p].seen[idx(x,y)];
function minesOf(p){return G.tiles.filter(t=>t.owner===p&&t.imp==='mina').length;}
function income(p){let m=0;for(const c of citiesOf(p)){m+=c.level+(c.cap?1:0)+(c.b.taller?1:0)+(c.b.biblioteca?1:0)+(has(p,'caminos')?1:0);}if(has(p,'engranajes'))m+=Math.min(3,minesOf(p));return m;}
function techCost(p,id){const t=TECH[id],base=[4,6,8][t.tier-1]*citiesOf(p).length;return t.pre&&!has(p,t.pre)?Math.ceil(base*1.5):base;}
function obraCost(p){return OBRA.cost-(has(p,'matematica')?5:0);}
function obraTechsOk(p){return has(p,OBRA.need)&&OBRA.any.some(t=>has(p,t));}
function obraMissing(p){const m=[];if(!has(p,OBRA.need))m.push(TECH[OBRA.need].n);if(!OBRA.any.some(t=>has(p,t)))m.push(OBRA.any.map(t=>TECH[t].n).join(' o '));return m;}
function obraCity(p){return citiesOf(p).find(c=>c.obra>0);}
function progress(p){const P=G.P[p];let v=0;if(has(p,OBRA.need))v+=0.3;if(OBRA.any.some(t=>has(p,t)))v+=0.3;v+=0.2*Math.min(1,P.money/obraCost(p));const oc=obraCity(p);if(oc)v=0.8+0.2*(1-oc.obra/OBRA.turns);if(G.over&&G.over.winner===p)v=1;return v;}

/* acciones sobre casilleros */
function tileActions(p,t){
  const a=[];if(t.owner!==p)return a;const c=cityOf(t.cid);
  if(t.imp)return a;
  if(t.res==='fruta')a.push({id:'fruta',n:'Cosechar fruta',cost:2,pop:1,tech:null});
  if(t.res==='caza')a.push({id:'caza',n:'Cazar',cost:2,pop:1,tech:'caza'});
  if(t.res==='pez')a.push({id:'pez',n:'Pescar',cost:2,pop:1,tech:'pesca'});
  if(t.res==='cultivo')a.push({id:'campo',n:'Campo',cost:5,pop:2,tech:'agricultura'});
  if(t.res==='metal')a.push({id:'mina',n:'Mina',cost:5,pop:2,tech:'mineria'});
  if(t.t===1&&!t.res&&!t.village&&!t.ruins)a.push({id:'aserradero',n:'Aserradero',cost:3,pop:1,tech:'tala'});
  for(const x of a){x.ok=(!x.tech||has(p,x.tech))&&G.P[p].money>=x.cost;x.why=x.tech&&!has(p,x.tech)?'Necesita '+TECH[x.tech].n:G.P[p].money<x.cost?'Te faltan monedas':'';x.city=c;}
  return a;
}
function doTileAction(p,t,a){
  const P=G.P[p];if(!a.ok)return false;P.money-=a.cost;
  if(a.id==='campo'||a.id==='mina'||a.id==='aserradero'){t.imp=a.id;t.res=null;}else t.res=null;
  addPop(a.city,a.pop);return true;
}
function addPop(c,n){
  c.pop+=n;let ups=0;
  while(c.pop>=c.level+1){c.pop-=c.level+1;c.level++;ups++;if(c.level>=3)updateSeen(c.owner);
    const lv=c.level,P=G.P[c.owner];
    if(P.ai)aiReward(c,lv);else pendingLevel.push({cid:c.id,lv});}
  return ups;
}
function rewardsFor(c,lv){
  if(lv===2)return[{id:'taller',n:'Taller',d:'+1 moneda por turno en esta ciudad'},{id:'caravana',n:'Caravana gratis',d:'Para explorar y fundar otra ciudad'}];
  if(lv===3)return[{id:'muralla',n:'Muralla',d:'El rival no puede sabotear esta ciudad'},{id:'territorio',n:'Territorio',d:'La ciudad abarca 2 casilleros a la redonda'}];
  return[{id:'monedas',n:(lv>=5?10:5)+' monedas',d:'Ahora mismo'},{id:'pop',n:'+3 población',d:'Crece de nuevo'}];
}
function applyReward(c,lv,id){
  const P=G.P[c.owner];
  if(id==='taller')c.b.taller=1;else if(id==='caravana'){if(G.units.filter(u=>u.owner===c.owner).length<3)G.units.push({id:G.nid++,owner:c.owner,x:c.x,y:c.y,mv:0});else P.money+=CARAVAN_COST;}
  else if(id==='muralla')c.b.muralla=1;else if(id==='territorio'){c.radius=2;claim(c);}
  else if(id==='monedas')P.money+=lv>=5?10:5;else if(id==='pop')addPop(c,3);
}
function aiReward(c,lv){
  const p=c.owner,r=rewardsFor(c,lv);let pick=r[0].id;
  if(lv===2){const freeV=G.tiles.some(t=>t.village);pick=(G.units.filter(u=>u.owner===p).length===0&&freeV&&citiesOf(p).length<3)?'caravana':'taller';}
  else if(lv===3){let around=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const t=tileAt(c.x+dx,c.y+dy);if(t&&t.owner<0&&t.res)around++;}pick=around>=2?'territorio':'muralla';}
  else pick='pop';
  applyReward(c,lv,pick);
}
function research(p,id){const P=G.P[p];if(has(p,id))return false;const cost=techCost(p,id);if(P.money<cost)return false;P.money-=cost;P.techs[id]=TECH[id].pre&&!has(p,TECH[id].pre)?2:1;if(id==='astronomia')updateSeen(p);return true;}
function buyCaravan(p,c){const P=G.P[p];if(c.owner!==p||c.trained===G.turn||P.money<CARAVAN_COST||G.units.filter(u=>u.owner===p).length>=3||unitAt(c.x,c.y))return false;P.money-=CARAVAN_COST;c.trained=G.turn;G.units.push({id:G.nid++,owner:p,x:c.x,y:c.y,mv:0});return true;}
function buildCity(p,c,what){const P=G.P[p];
  if(what==='biblioteca'){if(!has(p,'escritura')||c.b.biblioteca||P.money<6)return false;P.money-=6;c.b.biblioteca=1;addPop(c,1);return true;}
  if(what==='forja'){const mines=G.tiles.filter(t=>t.cid===c.id&&t.imp==='mina').length;if(!has(p,'fundicion')||c.b.forja||P.money<5||!mines)return false;P.money-=5;c.b.forja=1;addPop(c,2*mines);return true;}
  if(what==='obra'){if(!obraTechsOk(p)||obraCity(p)||P.money<obraCost(p))return false;P.money-=obraCost(p);c.obra=OBRA.turns;return true;}
  return false;}
const maxMv=p=>has(p,'caminos')?3:2;
function reachable(u){
  const p=u.owner,res={},start=idx(u.x,u.y);const dist={};dist[start]=0;const q=[[u.x,u.y,0]];
  while(q.length){q.sort((a,b)=>a[2]-b[2]);const [x,y,d]=q.shift();if(d>dist[idx(x,y)])continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy,t=tileAt(nx,ny);if(!t)continue;
      if(t.t===3&&!has(p,'navegacion'))continue;const step=t.t===2?u.mv:1;const nd=d+step;if(nd>u.mv)continue;
      const k=idx(nx,ny);if(dist[k]!=null&&dist[k]<=nd)continue;dist[k]=nd;

function moveUnit(u,x,y){const r=reachable(u);const k=idx(x,y);if(r[k]==null)return false;u.x=x;u.y=y;u.mv=0;updateSeen(u.owner);const t=tileAt(x,y);if(t.ruins){t.ruins=false;return ruinsReward(u.owner);}return true;}
function ruinsReward(p){const P=G.P[p];const r=Math.random();let txt;
  if(r<0.4){P.money+=8;txt='+8 monedas';}
  else if(r<0.7){const opts=Object.keys(TECH).filter(id=>!has(p,id)&&(!TECH[id].pre||has(p,TECH[id].pre)));if(opts.length){const id=opts[Math.floor(Math.random()*opts.length)];P.techs[id]=1;if(id==='astronomia')updateSeen(p);txt='tecnología: '+TECH[id].n;}else{P.money+=8;txt='+8 monedas';}}
  else{const c=citiesOf(p)[0];addPop(c,2);txt='+2 población en tu capital';}
  return{ruins:txt};}
function foundFromUnit(u){const t=tileAt(u.x,u.y);if(!t.village)return false;G.units.splice(G.units.indexOf(u),1);found(u.owner,u.x,u.y,false);return true;}
function canSabotage(p,c){if(c.owner===p||!seen(p,c.x,c.y))return'';if(c.b.muralla)return'Tiene muralla';if(c.sabT>=G.turn-1)return'Hace poco la saboteaste';if(G.P[p].money<SAB_COST)return'Te faltan monedas';return'ok';}
function sabotage(p,c){if(canSabotage(p,c)!=='ok')return false;G.P[p].money-=SAB_COST;c.sabT=G.turn;const O=G.P[c.owner];let txt;
  if(c.obra>0){c.obra++;txt='la obra se atrasa un turno';}else if(c.pop>0){c.pop--;txt='pierde 1 población';}else{O.money=Math.max(0,O.money-4);txt='pierde 4 monedas';}return{txt};}
function startTurn(p){const P=G.P[p];P.money+=income(p);for(const u of G.units)if(u.owner===p)u.mv=maxMv(p);
  const oc=obraCity(p);if(oc){oc.obra--;if(oc.obra<=0){oc.obra=0;oc.b.obra=1;G.over={winner:p,turn:G.turn,how:'obra'};}}}

/* ---------- IA ---------- */
function freeVillages(){return G.tiles.filter(t=>t.village);}
function bfsPath(u,tx,ty){const p=u.owner;const prev={};const start=idx(u.x,u.y);prev[start]=-1;const q=[[u.x,u.y]];
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy,t=tileAt(nx,ny);if(!t)continue;if(t.t===3&&!has(p,'navegacion'))continue;const k=idx(nx,ny);if(prev[k]!=null)continue;prev[k]=idx(x,y);q.push([nx,ny]);}}
  const goal=idx(tx,ty);if(prev[goal]==null)return null;const path=[];let k=goal;while(k!==start){path.push(k);k=prev[k];}return path.reverse();}
function aiPlan(p){
  const P=G.P[p],cnt={pez:0,caza:0,cultivo:0,metal:0,bosque:0};
  for(const c of citiesOf(p))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const t=tileAt(c.x+dx,c.y+dy);if(!t||(t.owner>=0&&t.owner!==p))continue;if(t.res&&cnt[t.res]!=null)cnt[t.res]++;if(t.t===1)cnt.bosque++;}
  const econ=[['pesca',cnt.pez],['caza',cnt.caza],['agricultura',cnt.cultivo*1.6],['mineria',cnt.metal*1.6]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  const water=['pesca','navegacion','astronomia'],land=['agricultura','escritura','matematica'];
  const anyPath=(cnt.pez>=2&&cnt.pez>cnt.cultivo+1)?water:land;
  const gear=cnt.metal>=1?['mineria','fundicion','engranajes']:['engranajes'];
  const order=[...econ,anyPath[0],gear[0],anyPath[1],gear[1]||anyPath[2],anyPath[2],...gear,'tala','caminos'];
  const out=[];for(const id of order)if(id&&!out.includes(id))out.push(id);
  return out.filter(id=>!has(p,id));
}
function aiTurn(p){
  const P=G.P[p],ev=[];
  if(G.over)return ev;
  for(const c of citiesOf(p))if(buildCity(p,c,'obra')){ev.push({k:'obra',c});break;}
  // caravanas
  for(const u of G.units.filter(u=>u.owner===p)){
    const t=tileAt(u.x,u.y);if(t.village){foundFromUnit(u);ev.push({k:'fundo',x:u.x,y:u.y});continue;}
    if(u.mv<=0)continue;
    const targets=[...freeVillages().map(v=>({t:v,w:0})),...G.tiles.filter(x=>x.ruins).map(v=>({t:v,w:1}))];
    let best=null,bd=1e9;for(const tg of targets){const d=cheb(u.x,u.y,tg.t.x,tg.t.y)+tg.w*1.5;if(d<bd){bd=d;best=tg.t;}}
    if(!best){continue;}
    const path=bfsPath(u,best.x,best.y);if(!path)continue;
    const r=reachable(u);let dest=null;for(let i=Math.min(path.length,u.mv)-1;i>=0;i--){if(r[path[i]]!=null){dest=path[i];break;}}
    if(dest==null){const cand=Object.keys(r).map(Number);let bk=null,bkd=1e9;for(const k of cand){const d=cheb(k%MW,(k/MW)|0,best.x,best.y);if(d<bkd){bkd=d;bk=k;}}if(bk!=null&&bkd<cheb(u.x,u.y,best.x,best.y))dest=bk;}
    if(dest!=null){const res=moveUnit(u,dest%MW,(dest/MW)|0);if(res&&res.ruins)ev.push({k:'ruinas'});const t2=tileAt(u.x,u.y);if(t2.village){foundFromUnit(u);ev.push({k:'fundo',x:u.x,y:u.y});}}
  }
  // caravana nueva
  const myU=G.units.filter(u=>u.owner===p).length,myC=citiesOf(p);
  if(myU===0&&myC.length<3&&G.turn<=14&&freeVillages().some(v=>myC.some(c=>cheb(c.x,c.y,v.x,v.y)<=6))&&P.money>=CARAVAN_COST){
    const c=myC.slice().sort((a,b)=>{const da=Math.min(...freeVillages().map(v=>cheb(a.x,a.y,v.x,v.y))),db=Math.min(...freeVillages().map(v=>cheb(b.x,b.y,v.x,v.y)));return da-db;})[0];
    if(buyCaravan(p,c))ev.push({k:'caravana'});}
  // economía e investigación
  const plan=aiPlan(p);
  for(let step=0;step<14;step++){
    const next=plan.find(id=>!has(p,id));const tc=next?techCost(p,next):1e9;
    const acts=[];for(const t of G.tiles)if(t.owner===p)for(const a of tileActions(p,t))if(a.ok)acts.push({t,a,score:a.pop/a.cost+(a.city.pop+a.pop>=a.city.level+1?0.4:0)});
    for(const c of myC){if(has(p,'escritura')&&!c.b.biblioteca&&P.money>=6)acts.push({c,what:'biblioteca',score:0.45});
      const mines=G.tiles.filter(t=>t.cid===c.id&&t.imp==='mina').length;if(has(p,'fundicion')&&!c.b.forja&&mines&&P.money>=5)acts.push({c,what:'forja',score:0.4*mines+0.2});}
    acts.sort((a,b)=>b.score-a.score);
    const canTech=next&&P.money>=tc;
    const nearTech=next&&P.money<tc&&tc-P.money<=income(p);
    if(canTech&&(G.turn>2||!acts.length)){research(p,next);ev.push({k:'tech',id:next});continue;}
    if(acts.length&&!(nearTech&&G.turn>4&&acts[0].score<0.6)){const x=acts[0];if(x.a)doTileAction(p,x.t,x.a);else buildCity(p,x.c,x.what);continue;}
    break;
  }
  // sabotaje
  const foe=1-p,oc=obraCity(foe);
  if(oc&&canSabotage(p,oc)==='ok'&&P.money>=SAB_COST){const r=sabotage(p,oc);ev.push({k:'sab',c:oc,txt:r.txt});}
  else if(P.money>=SAB_COST+10&&G.turn>8){const tg=citiesOf(foe).filter(c=>canSabotage(p,c)==='ok').sort((a,b)=>b.level-a.level)[0];if(tg&&Math.random()<0.35){const r=sabotage(p,tg);ev.push({k:'sab',c:tg,txt:r.txt});}}
  for(const c of citiesOf(p))if(buildCity(p,c,'obra')){ev.push({k:'obra',c});break;}
  return ev;
}
function endTurn(){
  if(!G||G.over)return[];
  sel=null;reach=null;
  startTurn(1);let ev=[];
  if(!G.over)ev=aiTurn(1);
  if(!G.over){G.turn++;if(G.turn>MAXT){const a=progress(0),b=progress(1);G.over={winner:a>b?0:b>a?1:-1,turn:MAXT,how:'tiempo'};}
    else{startTurn(0);for(const c of G.cities)c.trained=0;}}

  if(reach){for(const k in reach){const x=k%MW,y=(k/MW)|0;ctx.fillStyle='rgba(27,26,36,.55)';ctx.beginPath();ctx.arc(x*T+8,y*T+8,1.6,0,6.29);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x*T+8,y*T+8,1.05,0,6.29);ctx.fill();}}
  if(sel){const x=sel.x*T,y=sel.y*T,L=4.5,p=0.4;ctx.strokeStyle=Math.sin(now*6)>0?'#ffffff':'#5fe3d0';ctx.lineWidth=0.8;ctx.beginPath();
    for(const[cx,cy,sx,sy]of[[x+p,y+p,1,1],[x+T-p,y+p,-1,1],[x+p,y+T-p,1,-1],[x+T-p,y+T-p,-1,-1]]){ctx.moveTo(cx+sx*L,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+sy*L);}ctx.stroke();}
  if(!sel&&G.turn<=3&&!G.over){let best=null;for(const t of G.tiles)if(t.owner===0){const a=tileActions(0,t).find(x=>x.ok);if(a&&(!best||a.cost<best.a.cost))best={t,a};}
    if(best){const ax=best.t.x*T+8,ay=best.t.y*T-3+Math.sin(now*6)*1.5;ctx.fillStyle='#1b1a24';ctx.beginPath();ctx.moveTo(ax-4.2,ay-4.6);ctx.lineTo(ax+4.2,ay-4.6);ctx.lineTo(ax,ay+0.6);ctx.fill();ctx.fillStyle='#5fe3d0';ctx.beginPath();ctx.moveTo(ax-3.2,ay-4);ctx.lineTo(ax+3.2,ay-4);ctx.lineTo(ax,ay-0.4);ctx.fill();}}
}
function tapAt(e){if(!G||G.over)return;const r=cv.getBoundingClientRect();const wx=((e.clientX-r.left)*DPR-OX)/SC,wy=((e.clientY-r.top)*DPR-OY)/SC;const x=Math.floor(wx/T),y=Math.floor(wy/T);if(!inb(x,y))return;
  if(sel&&sel.k==='unit'&&reach&&reach[idx(x,y)]!=null){const u=unitAt(sel.x,sel.y);if(u&&u.owner===0){const res=moveUnit(u,x,y);SFX.move();if(res&&res.ruins){SFX.ruins();toast('Ruinas: '+res.ruins,'good');}sel={k:'unit',x,y};reach=null;save();hud();renderCtx();nextLevelModal();return;}}
  const u=unitAt(x,y);if(u&&u.owner===0&&seen(0,x,y)&&!(sel&&sel.k==='unit'&&sel.x===x&&sel.y===y)){sel={k:'unit',x,y};reach=u.mv>0?reachable(u):null;SFX.click();renderCtx();return;}
  sel={k:'tile',x,y};reach=null;SFX.click();renderCtx();}
// Tocar selecciona; arrastrar mueve el mapa; dos dedos o la rueda acercan y alejan.
const ptrs=new Map();let dragged=false;
const cpx=(x,y)=>{const r=cv.getBoundingClientRect();return[(x-r.left)*DPR,(y-r.top)*DPR];};
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(x){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});if(ptrs.size===1)dragged=false;else dragged=true;});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){if(!dragged&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>8)dragged=true;if(dragged){CX-=(e.clientX-p.x)*DPR/SC;CY-=(e.clientY-p.y)*DPR/SC;cam();}}
  else if(ptrs.size===2){const q=[...ptrs.values()].find(o=>o!==p),d0=Math.hypot(p.x-q.x,p.y-q.y),d1=Math.hypot(e.clientX-q.x,e.clientY-q.y);
    const[ax,ay]=cpx((p.x+q.x)/2,(p.y+q.y)/2),[bx,by]=cpx((e.clientX+q.x)/2,(e.clientY+q.y)/2);if(d0>0)zoomAt(d1/d0,ax,ay,bx,by);}
  p.x=e.clientX;p.y=e.clientY;});
const ptrUp=e=>{if(!ptrs.delete(e.pointerId))return;if(e.type==='pointerup'&&!ptrs.size&&!dragged)tapAt(e);};
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
cv.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=cpx(e.clientX,e.clientY);zoomAt(Math.exp(-e.deltaY*0.0015),x,y);},{passive:false});

function frame(){if(!alive())return;draw();requestAnimationFrame(frame);}
addEventListener('resize',()=>{if(alive())resize();});
const resumed=load();if(!resumed){newGame(Math.floor(Math.random()*1e9));save();}
resize();hud();renderCtx();requestAnimationFrame(frame);
if(!resumed)intro();else nextLevelModal();
if(location.search.indexOf('debug')>=0)window.__m={get G(){return G;},set G(v){G=v;},newGame,aiTurn,endTurn,sim,progress,research,tileActions,doTileAction,buyCaravan,moveUnit,reachable,foundFromUnit,sabotage,buildCity,techCost,citiesOf,hud,renderCtx,setSel:s=>{sel=s;renderCtx();},get sel(){return sel;},unitAt,cityAt,tileAt,save};
})();
</script>
